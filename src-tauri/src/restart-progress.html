<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重新打开 Codex</title><style>:root{color-scheme:light dark;--bg:#fafafa;--text:#202124;--muted:#62676d;--line:#dce0e3;--active:#176b59;--error:#b42318}@media(prefers-color-scheme:dark){:root{--bg:#202124;--text:#f1f3f4;--muted:#bbc0c5;--line:#4b5055;--active:#79d4b9;--error:#ffb4ab}}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}h1{font-size:22px;margin:0 0 6px}p{margin:0;color:var(--muted)}ol{padding:0;list-style:none;margin:24px 0}li{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--muted)}b{display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;width:28px;height:28px;font:13px Consolas,monospace;flex-shrink:0}li[data-state="active"]{font-weight:600;color:var(--active)}li[data-state="active"] b{border:2px solid var(--active)}li[data-state="done"]{color:var(--text)}li[data-state="done"] b{color:var(--active)}li[data-state="error"]{color:var(--error)}#message{border-top:1px solid var(--line);padding-top:16px;white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:12px;color:var(--muted);margin-top:16px}</style><h1 id="title">正在重新打开 Codex</h1><p>按顺序完成退出、启动与任务板连接。</p><ol><li><b>1</b>请求正常退出</li><li><b>2</b>等待 Codex 退出</li><li><b>3</b>启动 Codex</li><li><b>4</b>等待任务板就绪</li></ol><div id="message" role="status" aria-live="polite">正在准备重启…</div><footer>关闭此窗口只隐藏进度，重启仍会继续。</footer><script>window.restartError=(message)=>renderRestart({step:window.restartStep??0,message,result:"error"});window.renderRestart=({step,message,result})=>{window.restartStep=step;document.querySelectorAll("li").forEach((li,i)=>{li.dataset.state=i<step||result==="success"?"done":i===step?(result==="error"?"error":"active"):"pending";li.querySelector("b").textContent=li.dataset.state==="done"?"✓":String(i+1);});document.getElementById("message").textContent=message;document.getElementById("title").textContent=result==="success"?"Codex 已重新打开":result==="error"?"重启未完成":"正在重新打开 Codex";};renderRestart(window.__restartProgress??{step:0,message:"正在请求正常退出…"});</script></html>
